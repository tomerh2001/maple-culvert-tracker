name: Release

on:
  push:
    branches: [master]

concurrency:
  cancel-in-progress: true
  group: ${{ github.repository_id }}-publish-docker

env:
  CR_HOST: ghcr.io
  CR_OWNER: tomerh2001
  IMAGE_NAME_PREFIX: ghcr.io/tomerh2001/maple-culvert-tracker

jobs:
  # The full test suite (including postgres integration tests) gates every
  # publish: publish-services needs this job, and promote-stable needs
  # publish-services.
  test:
    name: Go test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version-file: "go.mod"
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test?sslmode=disable
        run: |
          go test -count=1 ./...
  publish-services:
    needs:
      - test
    uses: ./.github/workflows/build-service.yml
    strategy:
      matrix:
        service: &services
          - name: bot
            dockerfile: "Dockerfile.goapps"
            context: "."
            target: "final-with-server-assets"
            buildArgs: "APPNAME=main"
          - name: "chartmaker"
            dockerfile: "chartmaker/Dockerfile"
            context: "."
            target: "runner"
            buildArgs: ""
          - name: "periodicredis"
            dockerfile: "Dockerfile.goapps"
            context: "."
            target: "final"
            buildArgs: "APPNAME=periodicredis"
          - name: "cron"
            dockerfile: "Dockerfile.goapps"
            context: "."
            target: "cron"
            buildArgs: "APPNAME=auto_backup"
          - name: "autofill_characters"
            dockerfile: "Dockerfile.goapps"
            context: "."
            target: "final"
            buildArgs: "APPNAME=autofill_characters"
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      service-name: ${{ matrix.service.name }}
      service-dockerfile: ${{ matrix.service.dockerfile }}
      service-context: ${{ matrix.service.context }}
      service-target: ${{ matrix.service.target }}
      service-build-args: ${{ matrix.service.buildArgs }}
  promote-stable:
    name: Promote Stable - ${{ matrix.service.name }}
    permissions:
      contents: read
      packages: write
    environment: promote-stable
    runs-on: ubuntu-latest
    needs:
      - publish-services
    strategy:
      matrix:
        service: *services
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CR_HOST }}
          username: ${{ env.CR_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service.name }}:latest" \
            "${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}"
